<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pyramid Loader Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0c10; display: flex; align-items: center; justify-content: center; }
    #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react/": "https://esm.sh/react@18.2.0/",
      "react-dom": "https://esm.sh/react-dom@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
      "framer": "/framer-shim.js?v=2",
      "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom"
    }
  }
  </script>
</head>
<body>
  <div id="root">Loading pyramid...</div>
  <script type="module">
    try {
      import("https://framer.com/m/Pyramid-Animation-SkMRIc.js@fvlBkgo1F19ih2DxYeZI")
        .then(async (mod) => {
          console.log("Loaded mod:", mod);
          const React = await import("react");
          const ReactDOM = await import("react-dom/client");
          const PyramidComponent = mod.default;
          const root = ReactDOM.createRoot(document.getElementById("root"));
          root.render(React.createElement(PyramidComponent, { style: { width: "100%", height: "100%" } }));
        })
        .catch(err => {
          console.error("Pyramid load error:", err);
          document.getElementById("root").innerText = "Error: " + err.message;
        });
    } catch(e) {
      console.error("Outer error:", e);
      document.getElementById("root").innerText = "Outer Error: " + e.message;
    }
  </script>
</body>
</html>
